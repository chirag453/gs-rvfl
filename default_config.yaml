# Default configuration for GS-RVFL experiments

# Model parameters
model:
  n_hidden: 100
  scale: 1.0
  lambda_reg: 1e-4
  activation: tanh
  use_bias: true
  use_logistic: false
  use_standard_rvfl_fallback: true

# Experiment parameters
experiment:
  n_runs: 10
  test_size: 0.2
  random_state: 42

# Operator configuration
operators:
  tabular:
    g_operators: []
    b_operators: []
  sensor:
    time_window: 1
    include_acceleration: false
  video:
    time_window: 1
    include_acceleration: false
  skeleton:
    time_window: 1
    include_acceleration: true

# Hyperparameter search space
hyperparameters:
  n_hidden: [50, 100, 200, 500, 1000]
  lambda_reg: [2^-10, 2^-9, 2^-8, 2^-7, 2^-6, 2^-5, 2^-4, 2^-3, 2^-2, 2^-1, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  scale: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  activation: [sigmoid, tanh, radbas, sine, relu]

# Dataset splits
datasets:
  tabular:
    - iris
    - wine
    - breast_cancer
    - digits
    - mnist
    - letter
    - satellite
    - pendigits
    - optdigits
    - waveform
    - spambase
    - adult
    - covertype
    - segment
    - usps
  sensor:
    - har
    - wisdm
    - pamap2
  video:
    - kth
    - weizmann
    - ucf11
    - ucf101
    - hmdb51
  skeleton:
    - ntu
    - ntu120