# Configuration for video datasets

model:
  n_hidden: 500
  scale: 1.0
  lambda_reg: 1e-4
  activation: tanh
  use_bias: true

operators:
  g_operators:
    - type: VelocityOperator
      time_window: 1
      smoothing: true
  b_operators:
    - type: DisplacementOperator
      time_window: 1
      normalize: true

experiment:
  n_runs: 10
  test_size: 0.2

datasets:
  - kth
  - weizmann
  - ucf11